<h3 mat-dialog-title>{{ data.title }}</h3>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions>
  <button mat-button type="button" (click)="onDismiss()">No</button>
  <button mat-flat-button color="primary" type="button" (click)="onConfirm()" cdkFocusInitial>Yes</button>
</div>
